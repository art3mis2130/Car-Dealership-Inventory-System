# Render blueprint: one service, built from the Dockerfile, free tier.
#
# Deploy by pointing Render at this repository (New -> Blueprint); it reads
# this file and needs no further configuration.
#
# A note on persistence. Render's free tier has no persistent disk, so the
# SQLite file lives on the container's ephemeral filesystem: it survives
# normal running, but a redeploy or a cold start after the service idles
# begins from a fresh database. SEED_ON_START is therefore switched on, so
# the lot always has its twelve vehicles and the demo accounts. Purchases
# made during a session are real and atomic - they just do not outlive the
# container.
#
# For a deployment where they should, add a paid instance type and a disk:
#
#   disk:
#     name: dealership-data
#     mountPath: /var/data
#     sizeGB: 1
#
# and set DATABASE_PATH to /var/data/dealership.db.
services:
  - type: web
    name: apex-motors
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /app/data/dealership.db
      - key: SERVE_SPA
        value: 'true'
      - key: SPA_DIST_PATH
        value: /app/frontend/dist
      - key: TRUST_PROXY
        value: 'true'
      - key: SEED_ON_START
        value: 'true'
      - key: SEED_ADMIN_EMAIL
        value: admin@dealership.test
      - key: SEED_ADMIN_PASSWORD
        value: Admin123!
