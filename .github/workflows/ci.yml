name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch cancels the run already in flight: there is no
# value in finishing a run for code that has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the version package.json claims to support, so
        # that claim is actually tested rather than assumed.
        node: [20, 22]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (sources and tests)
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage
        env:
          # The suite sets its own, but a missing secret should never be the
          # reason CI fails confusingly.
          JWT_SECRET: ci-secret-not-used-in-production

      - name: Build
        run: npm run build

      - name: Verify the built server actually boots
        # A green test suite does not prove the compiled output runs: ESM
        # import paths and the dist layout are only exercised here.
        run: |
          node dist/server.js &
          server=$!
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:4000/api/health > /dev/null; then
              echo "API is up"
              curl -fsS http://localhost:4000/api/health
              kill $server
              exit 0
            fi
            sleep 1
          done
          echo "The compiled server never became healthy"
          kill $server || true
          exit 1
        env:
          JWT_SECRET: ci-secret-not-used-in-production
          DATABASE_PATH: ./data/ci.db
          NODE_ENV: production

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Only after both suites pass: no point building an image for code that
    # does not work.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the single-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: apex-motors:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it and check it serves both the API and the SPA
        run: |
          docker run -d --name apex -p 4000:4000 \
            -e JWT_SECRET=ci-secret-not-used-in-production \
            apex-motors:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health > /dev/null; then break; fi
            sleep 2
          done

          echo "--- health ---"
          curl -fsS http://localhost:4000/api/health

          echo "--- the SPA is served at the root ---"
          curl -fsS http://localhost:4000/ | grep -q '<div id="root">'

          echo "--- an unknown API route is still a JSON 404, not index.html ---"
          curl -s http://localhost:4000/api/nope | grep -q '"NOT_FOUND"'

          docker rm -f apex
